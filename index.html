<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rixto AI - Think Smarter. Create Faster.</title>

  <!-- React & ReactDOM CDNs -->

<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- React Root Mount Node -->
  <div id="root"></div>

  <!-- Application Logic Code Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Runtime API key (Defaulted to empty string for execution preview)
    const apiKey = "";

    function App() {
      const [activeTab, setActiveTab] = useState('chat'); // chat, image, voice, code, tools, admin, settings
      const [darkMode, setDarkMode] = useState(true);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Global Engine Settings
      const [selectedModel, setSelectedModel] = useState('gemini-2.5-flash');
      const [enableWebSearch, setEnableWebSearch] = useState(false);
      const [systemPrompt, setSystemPrompt] = useState('You are Rixto AI, an elite hyper-intelligent assistant designed to solve complex problems with extreme precision, speed, and elegance.');

      // Chat Workspace State
      const [chatHistory, setChatHistory] = useState([
        {
          id: '1',
          title: 'Quantum Computing Overview',
          updatedAt: 'Just now',
          messages: [
            {
              id: 'm1',
              sender: 'assistant',
              text: 'Hello! Ami **Rixto AI**. Ajke apnar workflow-te kivabe shahajjo korte pari? Apni amar kache code, research, image analysis ba media generation bolte paren.',
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]
        }
      ]);
      const [currentChatId, setCurrentChatId] = useState('1');
      const [chatInput, setChatInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [attachedFile, setAttachedFile] = useState(null);
      const chatEndRef = useRef(null);

      // Speech & Audio Synthesis State
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [currentAudio, setCurrentAudio] = useState(null);

      // Image Studio State
      const [imgPrompt, setImgPrompt] = useState('');
      const [isGeneratingImg, setIsGeneratingImg] = useState(false);
      const [generatedImgUrl, setGeneratedImgUrl] = useState(null);

      // Voice Lab State
      const [ttsText, setTtsText] = useState('Welcome to Rixto AI Voice Studio. Ami natural human tone-e kotha bolte pari.');
      const [selectedVoice, setSelectedVoice] = useState('Kore');
      const [isGeneratingVoice, setIsGeneratingVoice] = useState(false);

      // Code Generator State
      const [codePrompt, setCodePrompt] = useState('Create a high-performance LRU Cache in TypeScript with O(1) time complexity');
      const [generatedCode, setGeneratedCode] = useState('');
      const [isGeneratingCode, setIsGeneratingCode] = useState(false);

      // Content Tools State
      const [toolType, setToolType] = useState('resume');
      const [toolInput, setToolInput] = useState('');
      const [toolOutput, setToolOutput] = useState('');
      const [isToolProcessing, setIsToolProcessing] = useState(false);

      // Admin Stats
      const [adminStats] = useState({
        totalUsers: '142,890',
        activeSubscribers: '38,420',
        monthlyRevenue: '$284,500',
        apiRequests: '14.2M',
        avgResponseTime: '240ms',
        systemHealth: '99.98%'
      });

      const currentChat = chatHistory.find(c => c.id === currentChatId) || chatHistory[0];

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [currentChat?.messages, isGenerating]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, chatHistory, generatedImgUrl, isSpeaking]);

      // Retry Helper with Exponential Backoff
      async function fetchWithRetry(url, options, maxRetries = 5) {
        let delay = 1000;
        for (let i = 0; i < maxRetries; i++) {
          try {
            const response = await fetch(url, options);
            if (response.ok) return await response.json();
          } catch (err) {
            if (i === maxRetries - 1) throw err;
          }
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
        throw new Error('API request failed after retries');
      }

      // Handle Text Chat Request
      const handleSendMessage = async () => {
        if ((!chatInput.trim() && !attachedFile) || isGenerating) return;

        const userText = chatInput;
        const userMsg = {
          id: Date.now().toString(),
          sender: 'user',
          text: userText,
          file: attachedFile,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updatedMessages = [...currentChat.messages, userMsg];
        setChatHistory(prev =>
          prev.map(c => (c.id === currentChatId ? { ...c, messages: updatedMessages, updatedAt: 'Just now' } : c))
        );

        setChatInput('');
        setAttachedFile(null);
        setIsGenerating(true);

        try {
          let payload = {
            contents: [
              {
                parts: [
                  ...(userMsg.file && userMsg.file.base64
                    ? [{ inlineData: { mimeType: userMsg.file.type, data: userMsg.file.base64 } }]
                    : []),
                  { text: userText }
                ]
              }
            ],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          if (enableWebSearch) {
            payload.tools = [{ google_search: {} }];
          }

          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          const data = await fetchWithRetry(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const assistantText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Kono response generate hoyni.';
          const grounding = data.candidates?.[0]?.groundingMetadata?.groundingAttributions?.map(a => ({
            uri: a.web?.uri,
            title: a.web?.title
          }));

          const botMsg = {
            id: (Date.now() + 1).toString(),
            sender: 'assistant',
            text: assistantText,
            groundingSources: grounding,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setChatHistory(prev =>
            prev.map(c => (c.id === currentChatId ? { ...c, messages: [...updatedMessages, botMsg] } : c))
          );
        } catch (err) {
          const errorMsg = {
            id: (Date.now() + 1).toString(),
            sender: 'assistant',
            text: '⚠️ **Rixto Engine Error**: Connection problem hoyeche ba API Key set kora nei.',
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          setChatHistory(prev =>
            prev.map(c => (c.id === currentChatId ? { ...c, messages: [...updatedMessages, errorMsg] } : c))
          );
        } finally {
          setIsGenerating(false);
        }
      };

      // Convert Raw PCM Base64 to Playable Browser WAV Blob
      function pcmToWav(base64Pcm, sampleRate = 24000) {
        const buffer = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0)).buffer;
        const pcmSamples = new Int16Array(buffer);
        const wavBuffer = new ArrayBuffer(44 + pcmSamples.length * 2);
        const view = new DataView(wavBuffer);

        view.setUint32(0, 0x52494646, false); // "RIFF"
        view.setUint32(4, 36 + pcmSamples.length * 2, true);
        view.setUint32(8, 0x57415645, false); // "WAVE"
        view.setUint32(12, 0x666d7420, false); // "fmt "
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // Raw PCM
        view.setUint16(22, 1, true); // Mono
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        view.setUint32(36, 0x64617461, false); // "data"
        view.setUint32(40, pcmSamples.length * 2, true);

        for (let i = 0; i < pcmSamples.length; i++) {
          view.setInt16(44 + i * 2, pcmSamples[i], true);
        }

        return new Blob([wavBuffer], { type: 'audio/wav' });
      }

      // Synthesize Speech Function
      const handleSynthesizeSpeech = async (textToSpeak = ttsText) => {
        if (!textToSpeak) return;
        setIsGeneratingVoice(true);
        try {
          const payload = {
            contents: [{ parts: [{ text: textToSpeak }] }],
            generationConfig: {
              responseModalities: ['AUDIO'],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: selectedVoice }
                }
              }
            },
            model: 'gemini-2.5-flash-preview-tts'
          };

          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
          const res = await fetchWithRetry(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const audioPart = res.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
          if (audioPart) {
            const mimeType = audioPart.inlineData.mimeType || '';
            const sampleRateMatch = mimeType.match(/rate=(\d+)/);
            const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;

            const wavBlob = pcmToWav(audioPart.inlineData.data, sampleRate);
            const audioUrl = URL.createObjectURL(wavBlob);
            const audio = new Audio(audioUrl);

            if (currentAudio) currentAudio.pause();
            setCurrentAudio(audio);
            setIsSpeaking(true);

            audio.play();
            audio.onended = () => setIsSpeaking(false);
          }
        } catch (err) {
          alert('Audio synthesize korte somossha hoyeche.');
        } finally {
          setIsGeneratingVoice(false);
        }
      };

      // Image Generation Handler
      const handleGenerateImage = async () => {
        if (!imgPrompt.trim() || isGeneratingImg) return;
        setIsGeneratingImg(true);
        setGeneratedImgUrl(null);

        try {
          const payload = {
            instances: [{ prompt: imgPrompt }],
            parameters: { sampleCount: 1 }
          };

          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
          const data = await fetchWithRetry(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const b64Bytes = data.predictions?.[0]?.bytesBase64Encoded;
          if (b64Bytes) {
            setGeneratedImgUrl(`data:image/png;base64,${b64Bytes}`);
          }
        } catch (err) {
          alert('Image generation failed.');
        } finally {
          setIsGeneratingImg(false);
        }
      };

      // Code Studio Generator
      const handleGenerateCode = async () => {
        if (!codePrompt.trim() || isGeneratingCode) return;
        setIsGeneratingCode(true);

        try {
          const payload = {
            contents: [
              {
                parts: [
                  {
                    text: `You are an expert full stack software architect. Write production ready code for: ${codePrompt}`
                  }
                ]
              }
            ]
          };

          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          const data = await fetchWithRetry(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = data.candidates?.[0]?.content?.parts?.[0]?.text || '// No code output';
          setGeneratedCode(result);
        } catch (err) {
          setGeneratedCode('// Error communicating with Rixto AI Engine.');
        } finally {
          setIsGeneratingCode(false);
        }
      };

      // Content Tools Handler
      const handleProcessTool = async () => {
        if (!toolInput.trim() || isToolProcessing) return;
        setIsToolProcessing(true);

        let promptText = '';
        if (toolType === 'resume') promptText = `Generate an ATS-optimized resume summary for: ${toolInput}`;
        else if (toolType === 'essay') promptText = `Write an essay on: ${toolInput}`;
        else if (toolType === 'email') promptText = `Write an executive email about: ${toolInput}`;
        else if (toolType === 'translate') promptText = `Translate this text into English, Bengali, Hindi, French and Spanish: ${toolInput}`;

        try {
          const payload = { contents: [{ parts: [{ text: promptText }] }] };
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          const data = await fetchWithRetry(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          setToolOutput(data.candidates?.[0]?.content?.parts?.[0]?.text || 'Processing completed.');
        } catch (err) {
          setToolOutput('⚠️ Tool processing failed.');
        } finally {
          setIsToolProcessing(false);
        }
      };

      // File Reader Handler
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const base64Data = uploadEvent.target.result.split(',')[1];
          setAttachedFile({
            name: file.name,
            type: file.type,
            base64: base64Data
          });
        };
        reader.readAsDataURL(file);
      };

      // Create New Session
      const createNewChat = () => {
        const newId = Date.now().toString();
        const newChat = {
          id: newId,
          title: `Session #${chatHistory.length + 1}`,
          updatedAt: 'Just now',
          messages: [
            {
              id: 'm1',
              sender: 'assistant',
              text: 'New session started. Apni ki rokom sahajjo chan?',
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]
        };
        setChatHistory([newChat, ...chatHistory]);
        setCurrentChatId(newId);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans bg-slate-950 text-slate-100">
          
          {/* Header Navigation */}
          <header className="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <button 
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="md:hidden p-2 rounded-lg hover:bg-slate-800"
                >
                  <i data-lucide="menu" className="w-5 h-5"></i>
                </button>
                <div className="flex items-center space-x-2">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 p-0.5 shadow-lg flex items-center justify-center">
                    <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                      <i data-lucide="sparkles" className="w-5 h-5 text-indigo-400"></i>
                    </div>
                  </div>
                  <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                    RIXTO AI
                  </span>
                </div>
              </div>

              {/* Desktop Menu */}
              <nav className="hidden md:flex items-center space-x-1 bg-slate-900/50 border border-slate-800 p-1 rounded-xl">
                {[
                  { id: 'chat', label: 'AI Chat', icon: 'message-square' },
                  { id: 'image', label: 'Image Studio', icon: 'image' },
                  { id: 'voice', label: 'Voice Lab', icon: 'mic' },
                  { id: 'code', label: 'Code Dev', icon: 'code' },
                  { id: 'tools', label: 'Toolkit', icon: 'file-text' },
                  { id: 'admin', label: 'Admin', icon: 'shield-check' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-medium transition ${
                      activeTab === tab.id
                        ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                  >
                    <i data-lucide={tab.icon} className="w-4 h-4"></i>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              <div className="flex items-center space-x-3">
                <button 
                  onClick={() => setActiveTab('settings')}
                  className={`p-2 rounded-lg border transition ${
                    activeTab === 'settings' 
                      ? 'bg-indigo-600 text-white border-indigo-500' 
                      : 'bg-slate-900 border-slate-800 text-slate-400'
                  }`}
                >
                  <i data-lucide="settings" className="w-4 h-4"></i>
                </button>
                <div className="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-xs text-white">
                  RX
                </div>
              </div>
            </div>

            {/* Mobile Dropdown */}
            {mobileMenuOpen && (
              <div className="md:hidden border-b border-slate-800 bg-slate-900 p-4 space-y-2">
                {[
                  { id: 'chat', label: 'AI Chat Studio' },
                  { id: 'image', label: 'AI Image Generator' },
                  { id: 'voice', label: 'Voice Lab' },
                  { id: 'code', label: 'Code Dev' },
                  { id: 'tools', label: 'Content Tools' },
                  { id: 'admin', label: 'Admin Dashboard' },
                  { id: 'settings', label: 'Settings' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => {
                      setActiveTab(tab.id);
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full text-left px-3 py-2 rounded-lg text-sm font-medium ${
                      activeTab === tab.id ? 'bg-indigo-600 text-white' : 'text-slate-400'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* Main App Section */}
          <main className="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto p-4 md:p-6 gap-6">

            {/* TAB 1: CHAT */}
            {activeTab === 'chat' && (
              <div className="flex-1 flex gap-4 h-[calc(100vh-7rem)]">
                {/* Sidebar */}
                <div className="hidden lg:flex flex-col w-64 rounded-2xl border border-slate-800 bg-slate-900/50 p-3">
                  <button
                    onClick={createNewChat}
                    className="w-full flex items-center justify-center space-x-2 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs shadow transition"
                  >
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>New Session</span>
                  </button>

                  <div className="mt-4 text-[11px] font-semibold text-slate-500 uppercase px-2">History</div>

                  <div className="mt-2 flex-1 overflow-y-auto space-y-1">
                    {chatHistory.map(chat => (
                      <div
                        key={chat.id}
                        onClick={() => setCurrentChatId(chat.id)}
                        className={`p-2.5 rounded-xl cursor-pointer text-xs font-medium transition ${
                          currentChatId === chat.id
                            ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30'
                            : 'text-slate-400 hover:bg-slate-800/60'
                        }`}
                      >
                        {chat.title}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Main Chat Panel */}
                <div className="flex-1 flex flex-col rounded-2xl border border-slate-800 bg-slate-900/40 overflow-hidden">
                  <div className="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
                    <span className="text-xs font-bold text-slate-200">{currentChat?.title}</span>
                    <button
                      onClick={() => setEnableWebSearch(!enableWebSearch)}
                      className={`flex items-center space-x-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border transition ${
                        enableWebSearch
                          ? 'bg-blue-600/20 text-blue-400 border-blue-500/40'
                          : 'bg-slate-800 text-slate-400 border-slate-700'
                      }`}
                    >
                      <i data-lucide="globe" className="w-3.5 h-3.5"></i>
                      <span>Search Grounding</span>
                    </button>
                  </div>

                  {/* Messages */}
                  <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    {currentChat?.messages.map(msg => (
                      <div key={msg.id} className={`flex gap-3 ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[80%] rounded-2xl p-4 text-xs leading-relaxed ${
                          msg.sender === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 border border-slate-700 text-slate-200'
                        }`}>
                          <div className="whitespace-pre-wrap">{msg.text}</div>
                          
                          {/* Grounding Attribution Sources */}
                          {msg.groundingSources && msg.groundingSources.length > 0 && (
                            <div className="mt-3 pt-2 border-t border-slate-700 space-y-1">
                              <p className="text-[10px] font-semibold text-indigo-300">Sources:</p>
                              <div className="flex flex-wrap gap-1">
                                {msg.groundingSources.map((src, idx) => (
                                  <a key={idx} href={src.uri} target="_blank" className="text-[10px] bg-slate-900 text-indigo-400 px-2 py-0.5 rounded border border-slate-700 truncate max-w-[150px]">
                                    {src.title || src.uri}
                                  </a>
                                ))}
                              </div>
                            </div>
                          )}

                          <div className="mt-2 flex items-center justify-between text-[10px] opacity-60">
                            <span>{msg.timestamp}</span>
                            {msg.sender === 'assistant' && (
                              <button onClick={() => handleSynthesizeSpeech(msg.text)} className="hover:text-indigo-300">
                                Speak Audio
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                    {isGenerating && <div className="text-xs text-indigo-400 animate-pulse">Rixto AI computing...</div>}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Chat Input */}
                  <div className="p-3 border-t border-slate-800 bg-slate-900">
                    <div className="flex items-center space-x-2 bg-slate-950 border border-slate-800 rounded-xl p-1.5">
                      <label className="p-2 text-slate-400 hover:text-slate-200 cursor-pointer">
                        <i data-lucide="file-up" className="w-4 h-4"></i>
                        <input type="file" onChange={handleFileUpload} className="hidden" />
                      </label>
                      <input
                        type="text"
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                        placeholder="Write a message to Rixto AI..."
                        className="flex-1 bg-transparent outline-none text-xs text-slate-100 placeholder-slate-500 px-2"
                      />
                      <button
                        onClick={handleSendMessage}
                        disabled={isGenerating || (!chatInput.trim() && !attachedFile)}
                        className="p-2.5 rounded-lg bg-indigo-600 text-white disabled:opacity-40"
                      >
                        <i data-lucide="send" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
